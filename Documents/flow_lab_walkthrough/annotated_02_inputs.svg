<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#dc2626"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; fill: #111827; }
      .title { font-size: 42px; font-weight: 800; }
      .subtitle { font-size: 22px; fill: #475569; }
      .label { font-size: 28px; font-weight: 800; }
      .body { font-size: 22px; fill: #374151; }
      .arrow { stroke: #dc2626; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .box { fill: #fff; stroke: #dc2626; stroke-width: 3; rx: 12; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="56" y="58" class="title">第一步：输入用户文本和基础参数</text>
  <text x="56" y="92" class="subtitle">这里模拟终端发来的语音文本和导航条件；Codex 可以直接根据右侧 JSON 复现问题</text>
  <image href="flow-lab-input-full-crop.png" x="72" y="118" width="407" height="806"/>

  <rect class="box" x="560" y="132" width="895" height="120"/>
  <text x="590" y="174" class="label">用户发言</text>
  <text x="590" y="211" class="body">写自然语言测试句，例如“我在 413A 附近，想去 429B”。</text>
  <text x="590" y="240" class="body">点击“文本转 JSON”后会生成 intent。</text>
  <path class="arrow" d="M 560 220 C 425 260 340 345 230 430"/>

  <rect class="box" x="560" y="290" width="895" height="120"/>
  <text x="590" y="332" class="label">起点、目的地、楼层和语言</text>
  <text x="590" y="369" class="body">这些字段会直接进入 `/api/v1/route`。</text>
  <text x="590" y="398" class="body">可测试中文、英文和无障碍路线。</text>
  <path class="arrow" d="M 560 375 C 450 390 350 445 250 515"/>

  <rect class="box" x="560" y="450" width="895" height="128"/>
  <text x="590" y="494" class="label">视觉证据</text>
  <text x="590" y="533" class="body">识别文字和物体会组装成 `/api/v1/localize/visual`。</text>
  <text x="590" y="562" class="body">适合不用真实 VLM 时调试定位链路。</text>
  <path class="arrow" d="M 560 535 C 440 570 345 640 255 710"/>

  <rect class="box" x="560" y="630" width="895" height="128"/>
  <text x="590" y="674" class="label">推荐协作方式</text>
  <text x="590" y="713" class="body">把一次失败用例的发言、视觉 JSON 和响应日志发给 Codex。</text>
  <text x="590" y="742" class="body">能快速定位是数据、VLM 还是路由问题。</text>
</svg>
