<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 z" fill="#dc2626"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; fill: #111827; }
      .title { font-size: 42px; font-weight: 800; }
      .subtitle { font-size: 22px; fill: #475569; }
      .label { font-size: 27px; font-weight: 800; }
      .body { font-size: 21px; fill: #374151; }
      .arrow { stroke: #dc2626; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .box { fill: #fff; stroke: #dc2626; stroke-width: 3; rx: 12; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="56" y="58" class="title">第四步：用通信记录和 Codex 协作排错</text>
  <text x="56" y="92" class="subtitle">每条记录都保存请求模块、接口、HTTP 状态、耗时、发送 JSON 和响应 JSON</text>
  <image href="flow-lab-logs-crop.png" x="40" y="138" width="1110" height="648"/>

  <rect class="box" x="1180" y="150" width="380" height="112"/>
  <text x="1218" y="193" class="label">记录数量</text>
  <text x="1218" y="229" class="body">确认本次实验产生了多少条通信。</text>
  <path class="arrow" d="M 1190 222 C 1120 210 1040 198 1010 185"/>

  <rect class="box" x="1180" y="300" width="380" height="128"/>
  <text x="1218" y="343" class="label">请求流向</text>
  <text x="1218" y="379" class="body">例如 Browser -> Repository，</text>
  <text x="1218" y="407" class="body">说明这次请求访问了数据仓库。</text>
  <path class="arrow" d="M 1190 370 C 1010 360 850 340 650 338"/>

  <rect class="box" x="1180" y="475" width="380" height="128"/>
  <text x="1218" y="518" class="label">状态和耗时</text>
  <text x="1218" y="554" class="body">200 表示成功；404、422、502、503</text>
  <text x="1218" y="582" class="body">可直接定位错误类别。</text>
  <path class="arrow" d="M 1190 545 C 1030 510 930 450 1000 380"/>

  <rect class="box" x="1180" y="650" width="380" height="128"/>
  <text x="1218" y="693" class="label">点击回放</text>
  <text x="1218" y="729" class="body">点任意日志，右侧 JSON 检查器</text>
  <text x="1218" y="757" class="body">会恢复当时的请求和响应。</text>
  <path class="arrow" d="M 1190 720 C 1000 670 760 610 520 595"/>
</svg>
