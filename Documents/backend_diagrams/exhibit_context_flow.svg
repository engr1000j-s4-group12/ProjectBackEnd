<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; fill: #111827; }
      .title { font-size: 34px; font-weight: 700; }
      .sub { font-size: 19px; fill: #4b5563; }
      .head { font-size: 22px; font-weight: 700; }
      .body { font-size: 17px; fill: #374151; }
      .small { font-size: 15px; fill: #6b7280; }
      .line { stroke: #1f2937; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="56" y="64" class="title">展品上下文与 RAG 雏形</text>
  <text x="56" y="98" class="sub">当前已经能返回受控 facts；未来可把 facts 来源替换为向量检索结果</text>

  <rect x="70" y="190" width="215" height="155" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="114" y="230" class="head">1 用户提问</text>
  <text x="105" y="272" class="body">exhibit_id</text>
  <text x="105" y="302" class="body">question</text>
  <text x="105" y="332" class="small">language=zh/en</text>

  <rect x="360" y="190" width="215" height="155" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="400" y="230" class="head">2 API 路由</text>
  <text x="392" y="272" class="body">main.py</text>
  <text x="392" y="302" class="body">/context</text>
  <text x="392" y="332" class="small">校验展品 ID</text>

  <rect x="650" y="190" width="235" height="155" rx="14" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="698" y="230" class="head">3 展品资料</text>
  <text x="688" y="272" class="body">exhibits.json</text>
  <text x="688" y="302" class="body">summary + facts</text>
  <text x="688" y="332" class="small">当前 1 个示例展品</text>

  <rect x="960" y="190" width="240" height="155" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1002" y="230" class="head">4 受控上下文</text>
  <text x="997" y="272" class="body">facts</text>
  <text x="997" y="302" class="body">system_instruction</text>
  <text x="997" y="332" class="small">资料不足时说明不确定</text>

  <rect x="330" y="505" width="625" height="105" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="395" y="545" class="head">未来 RAG 替换点</text>
  <text x="395" y="578" class="body">把 exhibits.json 的 facts 扩展为文档库 + 向量检索，再保持相同 context 输出格式</text>

  <path d="M 285 268 L 360 268" class="line"/>
  <path d="M 575 268 L 650 268" class="line"/>
  <path d="M 885 268 L 960 268" class="line"/>
  <path d="M 768 345 C 760 430 710 472 642 505" class="line"/>
  <path d="M 1080 345 C 1030 443 930 495 955 557" class="line"/>

  <text x="75" y="430" class="small">调用接口：POST /api/v1/exhibits/{exhibit_id}/context</text>
  <text x="75" y="460" class="small">这个接口不直接调用大模型，只返回给终端或上层 LLM 的可控上下文</text>
</svg>
