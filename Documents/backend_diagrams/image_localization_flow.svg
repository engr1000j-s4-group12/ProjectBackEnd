<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; fill: #111827; }
      .title { font-size: 34px; font-weight: 700; }
      .sub { font-size: 19px; fill: #4b5563; }
      .head { font-size: 22px; font-weight: 700; }
      .body { font-size: 17px; fill: #374151; }
      .small { font-size: 15px; fill: #6b7280; }
      .line { stroke: #1f2937; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="56" y="64" class="title">图片定位工作流程</text>
  <text x="56" y="98" class="sub">设备上传图片，VLM 提取视觉证据，后端再用本地地图地标做位置匹配</text>

  <rect x="58" y="210" width="190" height="150" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="250" class="head">1 终端拍照</text>
  <text x="91" y="292" class="body">multipart/form-data</text>
  <text x="91" y="321" class="small">JPEG / PNG / WebP</text>

  <rect x="318" y="175" width="210" height="220" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="358" y="215" class="head">2 API 校验</text>
  <text x="350" y="257" class="body">main.py</text>
  <text x="350" y="287" class="body">最大 5 MiB</text>
  <text x="350" y="317" class="body">格式校验</text>
  <text x="350" y="347" class="small">失败返回 413/415/400</text>

  <rect x="603" y="175" width="220" height="220" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="654" y="215" class="head">3 VLM 适配</text>
  <text x="645" y="257" class="body">vlm.py</text>
  <text x="635" y="287" class="body">base64 图片</text>
  <text x="635" y="317" class="body">结构化 JSON</text>
  <text x="635" y="347" class="small">objects / texts / scene</text>

  <rect x="898" y="175" width="250" height="220" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="944" y="215" class="head">4 地标评分</text>
  <text x="930" y="257" class="body">visual_localization.py</text>
  <text x="930" y="287" class="body">匹配 visual_landmarks</text>
  <text x="930" y="317" class="body">结合 floor_hint</text>
  <text x="930" y="347" class="small">返回前 3 个候选</text>

  <rect x="370" y="510" width="540" height="95" rx="14" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="432" y="550" class="head">5 输出定位状态</text>
  <text x="432" y="582" class="body">matched：可继续导航    ambiguous：让用户确认    not_found：重新拍照或用二维码兜底</text>

  <path d="M 248 285 L 318 285" class="line"/>
  <path d="M 528 285 L 603 285" class="line"/>
  <path d="M 823 285 L 898 285" class="line"/>
  <path d="M 1023 395 C 1000 475 875 526 910 557" class="line"/>
  <path d="M 640 510 C 590 455 448 430 423 395" class="line"/>

  <text x="108" y="440" class="small">调用接口：POST /api/v1/localize/image</text>
  <text x="108" y="470" class="small">VLM 未配置返回 503；VLM 响应异常返回 502</text>
</svg>
