<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; fill: #111827; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #4b5563; }
      .box-title { font-size: 22px; font-weight: 700; }
      .box-text { font-size: 17px; fill: #374151; }
      .note { font-size: 16px; fill: #6b7280; }
      .line { stroke: #1f2937; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #6b7280; stroke-dasharray: 8 7; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="56" y="62" class="title">后端整体架构设计</text>
  <text x="56" y="96" class="subtitle">终端只负责交互；后端负责定位、导航、展品上下文；JSON 数据在启动时加载成内存索引</text>

  <rect x="55" y="185" width="185" height="170" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="88" y="225" class="box-title">小智终端</text>
  <text x="82" y="263" class="box-text">语音输入</text>
  <text x="82" y="293" class="box-text">拍照上传</text>
  <text x="82" y="323" class="box-text">播报结果</text>

  <rect x="345" y="140" width="245" height="260" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="395" y="180" class="box-title">FastAPI 路由层</text>
  <text x="378" y="220" class="box-text">main.py</text>
  <text x="378" y="250" class="box-text">schemas.py</text>
  <text x="378" y="280" class="box-text">errors.py</text>
  <text x="378" y="325" class="note">统一输入校验、错误码</text>
  <text x="378" y="353" class="note">暴露 /api/v1/* 接口</text>

  <rect x="690" y="100" width="245" height="130" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="748" y="140" class="box-title">定位模块</text>
  <text x="728" y="180" class="box-text">visual_localization.py</text>
  <text x="728" y="207" class="note">视觉地标评分匹配</text>

  <rect x="690" y="295" width="245" height="130" rx="14" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="748" y="335" class="box-title">导航模块</text>
  <text x="752" y="375" class="box-text">navigation.py</text>
  <text x="733" y="402" class="note">Dijkstra 最短路径</text>

  <rect x="1015" y="115" width="205" height="145" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="1061" y="155" class="box-title">VLM 服务</text>
  <text x="1052" y="194" class="box-text">vlm.py 适配</text>
  <text x="1043" y="224" class="note">OpenAI 兼容接口</text>

  <rect x="1008" y="365" width="220" height="190" rx="14" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="1054" y="405" class="box-title">JSON 数据层</text>
  <text x="1040" y="445" class="box-text">building_map.json</text>
  <text x="1040" y="475" class="box-text">exhibits.json</text>
  <text x="1040" y="505" class="box-text">Excel 模板</text>

  <rect x="347" y="490" width="245" height="120" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="404" y="530" class="box-title">Repository</text>
  <text x="382" y="570" class="box-text">加载、校验、别名索引</text>

  <path d="M 240 270 L 345 270" class="line"/>
  <path d="M 590 210 C 635 190 642 165 690 165" class="line"/>
  <path d="M 590 330 C 635 350 642 360 690 360" class="line"/>
  <path d="M 935 165 L 1015 187" class="line"/>
  <path d="M 935 360 C 965 396 970 440 1008 460" class="line"/>
  <path d="M 592 550 L 1008 475" class="line"/>
  <path d="M 467 400 L 467 490" class="line"/>
  <path d="M 690 205 C 637 245 620 505 592 540" class="line dashed"/>
  <path d="M 690 390 C 640 430 625 510 592 550" class="line dashed"/>
</svg>
